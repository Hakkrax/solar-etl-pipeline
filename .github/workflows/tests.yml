name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check src tests
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solar
          POSTGRES_PASSWORD: solar  # throwaway CI-only container
          POSTGRES_DB: solar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solar" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOLAR_ETL_TEST_DB_URL: postgresql+psycopg://solar:solar@localhost:5432/solar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e ".[postgres]"
      # same suite, every database test now runs against PostgreSQL 16
      - run: pytest -q
